name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g., 2.10.2)"
        required: false
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Validate release version
        id: release-version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          FILE_VERSION=$(python -c "exec(open('clipkit/version.py').read()); print(__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
              echo "Version mismatch: clipkit/version.py=$FILE_VERSION, tagged=$TAG_VERSION"
              exit 1
            fi
          fi
          if [ -n "$REQUESTED_VERSION" ] && [ "$FILE_VERSION" != "$REQUESTED_VERSION" ]; then
            echo "Version mismatch: clipkit/version.py=$FILE_VERSION, requested=$REQUESTED_VERSION"
            exit 1
          fi

          echo "TAG_VERSION=$FILE_VERSION" >> "$GITHUB_ENV"
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate changelog/version sync
        run: python scripts/check_version_sync.py

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ env.TAG_VERSION }}
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TAG_VERSION }}
          generate_release_notes: true
          files: |
            dist/*

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {}
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build-and-publish.outputs.version }}
          path: dist

      - name: Check PyPI credentials
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Configure the PYPI_API_TOKEN Actions secret for ClipKIT."
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false
