name: Galaxy tool

on:
  push:
    paths:
      - "galaxy/**"
      - ".github/workflows/galaxy-tool.yml"
  pull_request:
    paths:
      - "galaxy/**"
      - ".github/workflows/galaxy-tool.yml"
  workflow_dispatch:

jobs:
  lint:
    name: planemo lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install planemo
        run: python -m pip install --upgrade pip planemo
      - name: Lint
        working-directory: galaxy
        run: planemo lint clipkit.xml

  test:
    name: planemo test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install planemo
        run: python -m pip install --upgrade pip planemo
      - name: Run tests
        working-directory: galaxy
        run: |
          planemo test \
            --conda_dependency_resolution \
            --conda_auto_install \
            --conda_auto_init \
            clipkit.xml
